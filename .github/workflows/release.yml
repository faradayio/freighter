name: Release

# A tag publishes. A manual run builds the binaries and image without
# publishing anything, to prove a workflow change before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest, zig: false }
          - { target: aarch64-apple-darwin, os: macos-latest, zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Install the toolchain rust-toolchain.toml pins and add the target to
      # that one: a setup action's own toolchain is not the one cargo uses here.
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          name="freighter-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/freighter" README.md LICENSE-APACHE LICENSE-MIT "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: freighter-*.tar.gz*

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage binaries per platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; target="${pair##*:}-unknown-linux-musl"
            mkdir -p "bin/$arch"
            tar xzf "dist/freighter-${{ env.VERSION }}-${target}.tar.gz" --strip-components=1 -C "bin/$arch"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # Last, and only once everything else succeeded: a crates.io publish can't
  # be undone.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [github-release, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - run: cargo publish --locked -p bq-freighter
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
