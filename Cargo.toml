[workspace]
members = ["freighter"]
# Resolver 3 honours the crate's rust-version when picking dependency
# versions: a release whose own rust-version is newer is skipped for an
# older one (uuid 1.28 needs 1.89; the crate promises 1.88). Needs cargo
# 1.84+, under the 1.88 floor.
resolver = "3"

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.lints.clippy]
unwrap_used = "deny"

# The mover decodes and encodes millions of cells per second; thin LTO plus
# single-unit codegen buys mid-single-digit percent on those hot loops for
# nothing but release build time.
[profile.release]
lto = "thin"
codegen-units = 1
